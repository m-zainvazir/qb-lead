# Local containers: API, worker, scheduler, Redis and Mailpit. The database, login and storage
# are the hosted Supabase STAGING project named in .env (there is no local Supabase).
# Start through `make dev` / `make up`; they pass the root .env with --env-file.
name: leadgen

x-python-env: &python-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SUPABASE_URL: ${SUPABASE_URL:?set in .env}
  SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
  SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set in .env}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
  DATABASE_URL_API: ${DATABASE_URL_API:?set in .env}
  DATABASE_URL_SYSTEM: ${DATABASE_URL_SYSTEM:?set in .env}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
  WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
  SMTP_HOST: mailpit  # local test inbox; invitation emails land at http://127.0.0.1:54324
  SMTP_PORT: "1025"
  SMTP_FROM: ${SMTP_FROM:-no-reply@leadgen.local}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
  MAILGUN_SIGNING_KEY: ${MAILGUN_SIGNING_KEY:-}
  INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-in.leadgen.local}
  EXA_API_KEY: ${EXA_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  SERPER_API_KEY: ${SERPER_API_KEY:-}
  EMBEDDING_CACHE_DIR: /models
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set in .env}

x-python-build: &python-build
  context: ..
  dockerfile: infra/python.Dockerfile
  args:
    GIT_COMMIT: ${GIT_COMMIT:-dev}

services:
  api:
    build: { <<: *python-build, args: { PACKAGE: api, GIT_COMMIT: "${GIT_COMMIT:-dev}" } }
    image: leadgen-api:latest
    environment: *python-env
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5

  worker:
    build: { <<: *python-build, args: { PACKAGE: worker, GIT_COMMIT: "${GIT_COMMIT:-dev}" } }
    image: leadgen-worker:latest
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *python-env
    volumes: ["models:/models"]  # embedding model cache, downloaded once
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  scheduler:
    # Exactly one beat process, so scheduled jobs are never triggered twice.
    image: leadgen-worker:latest
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *python-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      worker: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy: { replicas: 1 }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]  # loopback only; never exposed to the network
    volumes: ["redis-data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  mailpit:
    # Catches every email the backend sends (invitations). Nothing leaves this machine.
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:54324:8025"  # web inbox
      - "127.0.0.1:54325:1025"  # SMTP, for tools run on the host (SMTP_PORT in .env)
    restart: unless-stopped

volumes:
  redis-data:
  models:
