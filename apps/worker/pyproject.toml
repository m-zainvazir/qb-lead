[project]
name = "worker"
version = "0.1.0"
description = "Celery worker and scheduler"
requires-python = ">=3.12,<3.13"
dependencies = [
    "core",
    "celery[redis]>=5.4",
    "fastembed>=0.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "httpx>=0.28",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
