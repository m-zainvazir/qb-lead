[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "email-validator>=2.2",
    "python-multipart>=0.0.18",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
