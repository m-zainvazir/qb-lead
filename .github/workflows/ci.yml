name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/check_migrations.py
      - run: uv run pytest -q -m "not db"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ci-placeholder
          API_URL: http://127.0.0.1:8000
          WEB_BASE_URL: http://localhost:3000

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --redact --no-banner
      - name: semgrep
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep scan --config auto --error --severity ERROR apps/ packages/
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - name: pip-audit
        run: uvx pip-audit -r apps/api/requirements.txt -r apps/worker/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high

  database:
    # Runs migrations on an empty database, then the tenant isolation suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: npm ci
      - run: uv sync --frozen
      - name: Start Supabase (migrations applied on an empty database)
        run: npx supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase db lint --local --level error
      - run: uv run python scripts/make_env.py
      - run: uv run python -m api.cli db-roles
      - name: Database tests
        run: uv run pytest -q -m db apps packages
        env:
          LEADGEN_USE_REAL_ENV: "1"
      - name: Start the API for the REST isolation checks
        run: |
          nohup uv run uvicorn api.asgi:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
      - name: Tenant isolation suite (every table with tenant_id)
        run: uv run pytest tests/isolation -q
